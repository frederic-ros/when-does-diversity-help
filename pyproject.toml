[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alframework"
version = "1.0.0"
description = "Batch active-learning strategies, benchmark engine and analysis pipeline for the paper 'When does diversity help in active learning?'"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Erwan Bertrand-Bonvillain"},
  {name = "Yassine Nasser"},
  {name = "Frédéric Ros", email = "frederic.ros@univ-orleans.fr"},
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "pyarrow>=12.0",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.7", "statsmodels>=0.14"]
dev = ["pytest>=7", "ruff>=0.3"]
embeddings = ["torch>=2.0", "torchvision>=0.15"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
